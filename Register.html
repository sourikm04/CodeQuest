<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Quest 2025 - Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Open+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Register.css">
</head>
<body>

    <header>
        <img class="Logo" src="IMAGES/logo.png" alt="Logo">
        <button class="menu-toggle">&#9776;</button>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="Venue.html">Venue</a>
            <a href="Schedule.html">Schedule</a>
            <a href="Rules.html">Rules & Eligibility</a>
            <a href="Register.html">Register</a>
            <a href="Contact.html">Contact</a>
        </nav>
    </header>

    <div class="container">
        <section class="contain-section">
            <h1>Registration</h1>
            <form id="registrationForm">
                <div class="form-group" style="animation-delay: 0.2s;">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Name">
                </div>

                <div class="form-group" style="animation-delay: 0.4s;">
                    <label for="contact">Contact Number</label>
                    <input type="tel" id="contact" name="contact" required placeholder="Contact">
                </div>

                <div class="form-group" style="animation-delay: 0.6s;">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" required placeholder="Address"></textarea>
                </div>

                <div class="form-group" style="animation-delay: 0.8s;">
                    <button type="submit" class="submit-btn">SUBMIT APPLICATION</button>
                </div>
            </form>
        </section>
    </div>

    <script>

        document.querySelector('.menu-toggle').addEventListener('click', function() {
            document.querySelector('.nav-links').classList.toggle('show');
            document.querySelector('.container').classList.toggle('slide-down');
        });

        document.querySelectorAll('.form-group').forEach((field, index) => {
            field.style.animationDelay = `${index * 0.2 + 0.2}s`;
        });

        document.getElementById('registrationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.innerHTML = 'Submitting...';
            submitBtn.disabled = true;

            setTimeout(() => {
                submitBtn.innerHTML = '✓ Registration Successful!';
                submitBtn.style.background = '#4CAF50';
                setTimeout(() => {
                    submitBtn.innerHTML = 'SUBMIT APPLICATION';
                    submitBtn.style.background = 'linear-gradient(45deg, #00eeff, #6f00ff)';
                    submitBtn.disabled = false;
                }, 2000);
            }, 1500);
        });
    </script>
</body>
</html>
